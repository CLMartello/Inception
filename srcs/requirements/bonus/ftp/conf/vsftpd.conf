listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002

chroot_local_user=YES
allow_writeable_chroot=YES
local_root=/var/www/html

pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
port_enable=NO

pam_service_name=vsftpd
secure_chroot_dir=/var/run/vsftpd/empty
