services:
  mariadb:
    build:
      context: ./requirements/mariadb
    image: mariadb
    container_name: mariadb
    env_file:
      - .env
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: unless-stopped

  wordpress:
    build:
      context: ./requirements/wordpress
    image: wordpress
    container_name: wordpress
    env_file:
      - .env
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped
  
  nginx:
    build:
      context: ./requirements/nginx
    image: nginx
    container_name: nginx
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped
      
  redis:
    profiles:
      - bonus
    build:
      context: ./requirements/bonus/redis
    image: redis
    container_name: redis
    networks:
      - inception
    restart: unless-stopped
    
  ftp:
    profiles:
      - bonus
    build:
      context: ./requirements/bonus/ftp
    image: ftp
    container_name: ftp
    env_file:
      - .env
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - wordpress
    restart: unless-stopped
    
  website:
    profiles:
      - bonus
    build:
      context: ./requirements/bonus/website
    image: website
    container_name: website
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: unless-stopped
    
  adminer:
    profiles:
      - bonus
    build:
      context: ./requirements/bonus/adminer
    image: adminer
    container_name: adminer
    ports:
      - "8081:8081"
    networks:
      - inception
    depends_on:
      - mariadb
    restart: unless-stopped
    
  cadvisor:
    profiles:
      - bonus
    build:
      context: ./requirements/bonus/cadvisor
    image: cadvisor
    container_name: cadvisor
    ports:
      - "8090:8090"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - inception
    restart: unless-stopped
      
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
    
volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb
  
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
      
networks:
  inception:
    driver: bridge
